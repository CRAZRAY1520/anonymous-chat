<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0D1017">
<title>匿名聊天室</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230D1017'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23E9B872'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- 畫面 A:輸入代號 -->
  <section id="screen-login" class="screen login">
    <div class="login-inner">
      <div class="login-head">
        <span class="lamp-dot" aria-hidden="true"></span>
        <h1>匿名聊天室</h1>
        <p>不用註冊,取個代號就能進來。<br>聊完就消失,不留下任何紀錄。</p>
      </div>
      <form id="login-form" class="login-form" novalidate>
        <label for="nick">你的代號</label>
        <div class="field">
          <input id="nick" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="login-msg">
          <span id="nick-count" class="field-count" aria-hidden="true">0/12</span>
        </div>
        <div id="login-msg" class="login-msg" role="alert"></div>
        <button id="login-btn" type="submit" class="btn-primary" disabled>進入聊天室</button>
      </form>
    </div>
    <p class="login-foot">原始碼：<a href="https://github.com/CRAZRAY1520/anonymous-chat" target="_blank" rel="noopener noreferrer">https://github.com/CRAZRAY1520/anonymous-chat</a></p>
  </section>

  <!-- 畫面 C:聊天室已滿 -->
  <section id="screen-full" class="screen login is-dim" hidden>
    <div class="login-inner">
      <div class="login-head">
        <span class="lamp-dot" aria-hidden="true"></span>
        <h1>聊天室已滿</h1>
        <p>目前線上已經有 50 人,暫時進不去。<br>過一會兒再來看看。</p>
      </div>
      <div class="login-form">
        <div id="full-msg" class="login-msg is-lamp" role="status">聊天室已滿,請稍後再來。</div>
        <button id="retry-btn" type="button" class="btn-outline">重試</button>
      </div>
    </div>
  </section>

  <!-- 畫面 B:聊天室 -->
  <section id="screen-chat" class="screen chat" hidden>
    <main class="chat-main">
      <header class="topbar">
        <div class="brand"><span class="lamp-dot small" aria-hidden="true"></span>匿名聊天室</div>
        <div class="topbar-actions">
          <button id="pill" type="button" class="pill" aria-expanded="false" aria-controls="roster-panel">
            <span class="online-dot" aria-hidden="true"></span><span>線上 <span id="count-pill">0</span> 人</span><span id="pill-caret" aria-hidden="true">▾</span>
          </button>
          <button id="leave-btn" type="button" class="btn-ghost">離開</button>
        </div>
      </header>

      <div id="conn-banner" class="conn-banner" role="status" hidden>
        <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"></path></svg>
        連線中斷,嘗試重新連線…
      </div>

      <div class="log-wrap">
        <div id="log" class="log" role="log" aria-live="polite" aria-relevant="additions" tabindex="0" aria-label="聊天訊息">
          <div id="log-inner" class="log-inner"></div>
        </div>

        <div id="empty" class="empty">
          <span class="lamp-dot glow" aria-hidden="true"></span>
          <div class="empty-title">還沒有人說話</div>
          <div class="empty-sub">這裡說的話,聊完就不見了。<br>先打聲招呼吧。</div>
        </div>

        <button id="new-msg" type="button" class="new-msg" hidden>
          <span id="new-msg-text">有 1 則新訊息</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"></path></svg>
        </button>

        <div id="roster-backdrop" class="roster-backdrop" hidden></div>
        <section id="roster-panel" class="roster-panel" aria-label="線上名單" hidden>
          <div class="roster-title">線上 <span id="count-panel">0</span> 人</div>
          <ul id="roster-panel-list" class="roster-list"></ul>
        </section>
      </div>

      <footer class="composer">
        <div class="composer-inner">
          <div class="composer-row">
            <textarea id="text" rows="1" aria-label="輸入訊息" placeholder="說點什麼…" enterkeyhint="enter"></textarea>
            <button id="send-btn" type="button" class="send" aria-label="送出" disabled>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
            </button>
          </div>
          <div class="composer-meta">
            <span id="hint" class="hint"></span>
            <span id="remain" class="remain">還能輸入 200 字</span>
          </div>
        </div>
      </footer>
    </main>

    <aside id="roster-side" class="roster-side" aria-label="線上名單">
      <div class="roster-title"><span class="online-dot" aria-hidden="true"></span>線上 <span id="count-side">0</span> 人</div>
      <ul id="roster-side-list" class="roster-list"></ul>
    </aside>
  </section>

</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
